<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash</title>
    <!--
        Loads TradingView's Lightweight Charts library (v5) from the unpkg CDN.
        Exposes the global `LightweightCharts` object (createChart, series
        types like CandlestickSeries/LineSeries/HistogramSeries, marker
        helpers, TickMarkType, etc.) that every inline script below depends
        on for rendering the candlestick charts. Must load before any other
        script on this page runs.
    -->
    <script src="https://unpkg.com/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        html,
        body {
            -webkit-touch-callout: none;
            /* iOS Safari */
            -webkit-user-select: none;
            /* Safari */
            -moz-user-select: none;
            /* Firefox */
            -ms-user-select: none;
            /* Internet Explorer/Edge */
            user-select: none;
            /* Standard syntax */
            margin: 0;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: row;
            font-size: 16px;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .pair-row {
            color: white;
            font-size: 0.8rem;
            display: flex;
            margin: 2px 0px;
            padding: 2px 5px;
            align-items: center;
            cursor: pointer;
        }

        .pair-row.selected {
            background-color: #222;
        }

        .pair-row.selected .name,
        .pair-row.selected .timer {
            color: white;
        }

        .pair-row.selected .gran {
            opacity: 0.6;
        }

        .pair-row .name {
            width: 5vw;
            color: #555;
        }

        .pair-row .gran {
            border: 1px solid transparent;
            color: #333;
            font-size: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px 5px;
            margin: 0px 2px;
            border-radius: 0.2rem;
            font-weight: bold;
            opacity: 0.3;
        }

        .pair-row .gran.mkt_state_sell {
            color: crimson;
        }

        .pair-row .gran.mkt_state_sell.ready {
            border: 1px solid crimson;
        }

        .pair-row .gran.mkt_state_sell.trigger {
            border: 1px solid crimson;
            background-color: crimson;
            color: #000;
            opacity: 1.0;
        }

        .pair-row .gran.mkt_state_buy {
            color: lime;
        }

        .pair-row .gran.mkt_state_buy.ready {
            border: 1px solid lime;
        }

        .pair-row .gran.mkt_state_buy.trigger {
            border: 1px solid lime;
            background-color: lime;
            color: #000;
            opacity: 1.0;
        }

        .pair-row .timer {
            color: #333;
            margin-left: 20px;
            font-size: 0.5rem;
            width: 30px;
        }

        .pair-row .timer.warning {
            color: red;
        }

        #sidebar {
            width: 250px;
            height: 100vh;
            overflow-y: scroll;
        }

        #sidebar>#triggered-header {
            background-color: dodgerblue;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            justify-content: center;
            color: #000;
        }

        #sidebar #watchlist-header {
            margin-top: 5px;
            background-color: #fff;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            justify-content: center;
            color: #000;
        }

        #charts {
            display: flex;
            flex-wrap: wrap;
            width: calc(100vw - 250px);
            height: 100vh;
        }

        .chart {
            width: 50%;
            height: 50vh;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <div id="triggered-header">TRIGGERED</div>
        <div id="triggered"></div>
        <div id="watchlist-header">WATCHLIST</div>
        <div id="watchlist"></div>
    </div>
    <div id="charts">
        <div class="chart" id="2"></div>
        <div class="chart" id="4"></div>
        <div class="chart" id="1"></div>
        <div class="chart" id="3"></div>
    </div>
</body>
<!--
    Global config, state, and chart setup.
    - Reads the OANDA API token from localStorage, prompting for it once and
      persisting it if missing.
    - Defines the account id, the granularities (GRAN) and instrument pairs
      (PAIRS) the dashboard tracks, and shared style settings for candles
      and chart chrome (colors, crosshair, grid, time-axis formatting in the
      Europe/Athens timezone).
    - Creates one LightweightCharts chart per grid cell (#1-#4, one per
      granularity), each with a candlestick series, 4 line series (zigzag,
      protected high/low, entry line), 3 histogram series in a second pane
      (market-state up/down/background), and 3 marker sets (signal arrows,
      take-profit, raw signals). All chart handles are pushed onto the
      module-level `chartObjects` array for later scripts to update.
-->
<script>
    const TOKEN = localStorage.getItem('oanda_token') ?? prompt('OANDA token:');
    if (TOKEN) localStorage.setItem('oanda_token', TOKEN);
    const BOT_TOKEN = localStorage.getItem('bot_token') ?? prompt('BOT token:');
    if (BOT_TOKEN) localStorage.setItem('bot_token', BOT_TOKEN);
    const CHAT_ID = localStorage.getItem('chat_id') ?? prompt('Chat ID:');
    if (CHAT_ID) localStorage.setItem('chat_id', CHAT_ID);

    const ACCOUNT = '001-003-11032463-001';
    const GRAN = ['M5', 'M15', 'M30', 'H1'];
    const PAIRS = [
        "AUD_CAD", "AUD_CHF", "AUD_JPY", "AUD_NZD", "AUD_USD",
        "CAD_CHF", "CAD_JPY", "CHF_JPY",
        "EUR_AUD", "EUR_CAD", "EUR_CHF", "EUR_GBP", "EUR_JPY", "EUR_NZD", "EUR_USD",
        "GBP_AUD", "GBP_CAD", "GBP_CHF", "GBP_JPY", "GBP_NZD", "GBP_USD",
        "NZD_CAD", "NZD_CHF", "NZD_JPY", "NZD_USD",
        "USD_CAD", "USD_CHF", "USD_JPY",
        "XAG_USD", "XAU_USD"
    ];
    const MONTH = [
        'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec',
    ]
    const allCandlesData = {};
    const CANDLES_SETTINGS = {
        upColor: 'white',
        downColor: '#1f1f1f',
        borderColor: 'white',
        wickColor: 'white'
    }
    const CHART_SETTINGS = {
        autoSize: true,
        layout: {
            background: 'black',
            textColor: '#888',
            attributionLogo: false
        },
        crosshair: {
            mode: 0,
            vertLine: {
                color: '#333',
                labelBackgroundColor: '#333',
            },
            horzLine: {
                color: '#333',
                labelBackgroundColor: '#333',
            }
        },
        grid: {
            vertLines: {
                visible: false
            },
            horzLines: {
                visible: false
            }
        },
        localization: {
            timeFormatter: (time) => {
                // time is a UTCTimestamp in seconds
                const date = new Date(time * 1000);
                return date.toLocaleDateString('en-GB', {
                    timeZone: 'Europe/Athens',
                    month: 'short',
                    day: '2-digit',
                    year: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hourCycle: 'h23',
                    hour12: false
                }).replace(/\s\bat\b\s/, ', ');
            },
        },
        timeScale: {
            timeVisible: true,
            tickMarkFormatter: (time, tickMarkType, locale) => {
                const date = new Date(time * 1000);
                switch (tickMarkType) {
                    case LightweightCharts.TickMarkType.Year:
                        return date.toLocaleDateString('en-US', {
                            timeZone: 'Europe/Athens',
                            year: 'numeric'
                        });

                    case LightweightCharts.TickMarkType.Month:
                        return date.toLocaleDateString('en-US', {
                            timeZone: 'Europe/Athens',
                            month: 'short'
                        });

                    case LightweightCharts.TickMarkType.DayOfMonth:
                        return date.toLocaleDateString('en-GB', {
                            timeZone: 'Europe/Athens',
                            month: 'short',
                            day: '2-digit',
                            year: '2-digit'
                        });

                    case LightweightCharts.TickMarkType.Time:
                        return date.toLocaleTimeString('en-US', {
                            timeZone: 'Europe/Athens',
                            hour: '2-digit',
                            minute: '2-digit',
                            hour12: false
                        });
                    default:
                        return date.toLocaleDateString('en-GB', {
                            timeZone: 'Europe/Athens',
                            month: 'short',
                            day: '2-digit',
                            year: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            hourCycle: 'h23',
                            hour12: false
                        }).replace(/\s\bat\b\s/, ', ');
                }
            },
        },
    };

    const chartObjects = [];

    for (let i = 1; i <= 4; i++) {
        const chart = LightweightCharts.createChart(document.getElementById(`${i}`), CHART_SETTINGS);
        const series = chart.addSeries(LightweightCharts.CandlestickSeries, CANDLES_SETTINGS);
        const line1 = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 1,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            crosshairMarkerVisible: false
        });
        const line2 = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 2,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            color: 'teal',
            lineType: 1,
            crosshairMarkerVisible: false
        });
        const line3 = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 2,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            color: 'orange',
            lineType: 1,
            crosshairMarkerVisible: false
        });
        const line4 = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 1,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            color: 'fuchsia',
            lineType: 1,
            lineStyle: 2,
            crosshairMarkerVisible: false
        });
        const hist1 = chart.addSeries(
            LightweightCharts.HistogramSeries,
            {
                color: 'teal',
                axisLabelVisible: false,
                lastValueVisible: false,
                priceLineVisible: false,
                priceFormat: {
                    type: 'volume',
                },
            },
            1 // Pane index
        );
        const hist2 = chart.addSeries(
            LightweightCharts.HistogramSeries,
            {
                color: 'crimson',
                axisLabelVisible: false,
                lastValueVisible: false,
                priceLineVisible: false,
                priceFormat: {
                    type: 'volume',
                },
            },
            1 // Pane index
        );
        const hist3 = chart.addSeries(
            LightweightCharts.HistogramSeries,
            {
                color: 'transparent',
                axisLabelVisible: false,
                lastValueVisible: false,
                priceLineVisible: false,
                priceFormat: {
                    type: 'volume',
                },
            },
            1 // Pane index
        );

        const marker1 = LightweightCharts.createSeriesMarkers(series, []);
        const marker2 = LightweightCharts.createSeriesMarkers(series, []);
        const marker3 = LightweightCharts.createSeriesMarkers(hist2, []);

        chart.panes()[1].setHeight(50);

        chartObjects.push({
            chart,
            series,
            timeScale: chart.timeScale(),
            lines: [line1, line2, line3, line4],
            hists: [hist1, hist2, hist3],
            markers: [marker1, marker2, marker3]
        })
    }
</script>
<!--
    Chart-painting helpers, used whenever a pair is (re)selected.
    - setChartData: pushes candle data into a series; when resetChart is true,
      scrolls the time axis to show roughly the most recent 100 bars.
    - setIndicator: takes the output of calculateOMS (below) and distributes
      it across a chart's line/histogram/marker series - zigzag points,
      protected high/low, entry line, market-state histograms split into
      buy/sell/background, and buy/sell signal + take-profit markers.
    - render: the main entry point, called on row click, keyboard
      navigation, and the 5s poll loop below (which re-renders whichever
      pair is currently selected once its data refreshes - see that
      script's comment). Bails out until every pair/granularity has data
      loaded, updates the sidebar's `.selected` row and the document title
      (pair name, slash-separated), applies each chart's candlestick
      priceFormat from that pair/granularity's cached precision (see
      getCandles) so the price axis shows the right number of decimals per
      instrument, then clears and repopulates all 4 charts (one per
      granularity) from the cached allCandlesData for that pair.
-->
<script>
    const setChartData = (series, timeScale, data, resetChart = false) => {
        series.setData(data);

        if (resetChart) {
            const totalBars = data.length;
            // Set the last 50 candles to be visible
            timeScale.setVisibleLogicalRange({
                from: totalBars - 100,
                to: totalBars + 10,
            });
        }
    }

    const setIndicator = (chart, series, lines, hists, markers, indicatorData) => {
        const {
            zzPts,
            protectedHigh, protectedLow,
            imbUpper, imbLower,
            entryLine,
            mktState,
            signalsCandle, signals, tp,
            shouldBuy, correctZoneSize, freshZone, imbInProtectedArea, enteredImbZone
        } = indicatorData;

        // lines[0].setData(zzPts);
        lines[1].setData(protectedHigh);
        lines[2].setData(protectedLow);
        lines[3].setData(entryLine);
        hists[0].setData(mktState.filter(e => e.value == 1).map(e => ({ time: e.time, value: 1 })));
        hists[1].setData(mktState.filter(e => e.value == -1).map(e => ({ time: e.time, value: 1 })));
        hists[2].setData(mktState.map(e => ({ time: e.time, value: -1 })));

        markers[0].setMarkers(signalsCandle);
        markers[1].setMarkers(tp);
        // markers[2].setMarkers(signals)
    }

    const render = (pair, reset = true) => {
        if (Object.keys(allCandlesData).length < PAIRS.length * GRAN.length) return;
        Array.from(document.querySelectorAll('.pair-row')).map(e => e.classList.remove('selected'));
        document.querySelector(`.pair-row#${pair}`).classList.add('selected');
        document.title = pair.replace('_', '/');
        for (let i = 0; i < 4; i++) {
            const chartObj = chartObjects[i];
            const key = `${pair}_${GRAN[i]}`;
            const candlesData = allCandlesData[key]['candles'];
            const indicatorData = allCandlesData[key]['indicators'];
            const precision = allCandlesData[key]['precision'] ?? 5;

            // reset
            chartObj.lines[0].setData([]);
            chartObj.lines[1].setData([]);
            chartObj.lines[2].setData([]);
            chartObj.lines[3].setData([]);
            chartObj.hists[0].setData([]);
            chartObj.hists[1].setData([]);
            chartObj.hists[2].setData([]);
            chartObj.markers[0].setMarkers([])
            chartObj.markers[1].setMarkers([])
            chartObj.markers[2].setMarkers([])

            chartObj.series.applyOptions({
                priceFormat: {
                    type: 'price',
                    precision,
                    minMove: 1 / (10 ** precision)
                }
            });

            setChartData(chartObj.series, chartObj.timeScale, candlesData, reset);
            setIndicator(chartObj.chart, chartObj.series, chartObj.lines, chartObj.hists, chartObj.markers, indicatorData);
        }
    }
</script>
<!--
    getCandles(pair, gran, count): fetches candle data from the OANDA v3 REST
    API for one instrument/granularity pair (bid prices, Unix timestamps).
    - On the initial call (count === 5000) it replaces the cached candle
      array outright; on subsequent polls it merges each returned candle into
      the existing array by time, updating in place or appending as needed.
    - Recomputes the indicator via calculateOMS and stores the result
      alongside the candles in allCandlesData, along with a
      lastUpdatedTime timestamp used by the staleness timer.
    - Derives that instrument's decimal precision from the raw bid-close
      strings (OANDA pads each instrument to a fixed number of decimals, e.g.
      "1.09456" vs "156.789") and caches it as `precision`, so render (above)
      can format each chart's price axis correctly per pair.
    - Delegates to updatePairRows(pair, gran) to sync that granularity's
      sidebar badge from the fresh indicator values.

    updatePairRows(pair, gran): sets one pair/granularity's ".gran" badge
    classes from its cached indicator values - which side the market state
    favors (buy/sell) and whether a setup is "ready" or has "trigger"ed -
    then stamps that badge's `data-time` with its latest signal candle's
    time and rolls the pair row's own `data-time` up to the max across all
    of that pair's granularities, which sortList (below) sorts on.
-->
<script>
    // the browser pools + keep-alives connections to OANDA automatically (HTTP/2)
    const getCandles = (pair, gran, count = 5000) => {
        const url = new URL(`https://api-fxtrade.oanda.com/v3/accounts/${ACCOUNT}/instruments/${pair}/candles`);
        url.search = new URLSearchParams({
            granularity: gran,
            price: 'B',
            count: count
        });
        return fetch(url, {
            headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Accept-Datetime-Format': 'Unix'
            }
        })
            .catch(err => console.error(err))
            .then(res => {
                if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);
                return res.json();
            })
            .then(({ candles }) => ({
                // OANDA prices are fixed-width decimal strings per instrument
                // (e.g. "1.09456" vs "156.789"), so this reflects that pair's
                // real display precision instead of guessing from the pair name.
                precision: candles.reduce((max, e) => Math.max(max, (e.bid.c.split('.')[1] || '').length), 0),
                candles: candles.map(e => ({
                    volume: e.volume,
                    complete: e.complete,
                    time: parseInt(e.time),
                    open: +e.bid.o,
                    high: +e.bid.h,
                    low: +e.bid.l,
                    close: +e.bid.c
                }))
            }))
            .then(({ candles, precision }) => {
                const key = `${pair}_${gran}`;
                let candlesData = [];
                if (count === 5000) {
                    candlesData = candles;
                } else {
                    candlesData = allCandlesData[key]['candles'];
                    for (const candle of candles) {
                        if (candlesData.filter(e => e.time == candle.time).length == 0)
                            candlesData.push(candle);
                        else {
                            candlesData = candlesData.map(e => {
                                if (e.time == candle.time)
                                    return candle
                                else
                                    return e
                            });
                        }
                    }
                }
                allCandlesData[key]['candles'] = candlesData;
                if (precision > 0) allCandlesData[key]['precision'] = precision;
                allCandlesData[key]['lastUpdatedTime'] = Math.floor(Date.now() / 1000); //unix time
                const indicatorData = calculateOMS(candlesData);
                allCandlesData[key]['indicators'] = indicatorData;
                updatePairRows(pair, gran);
                return candles;
            });
    };

    const updatePairRows = (pair, gran) => {
        const key = `${pair}_${gran}`;
        const indicatorData = allCandlesData[key]['indicators'];
        const {
            shouldBuy, correctZoneSize, freshZone, imbInProtectedArea, enteredImbZone, signalsCandle
        } = indicatorData;
        const pairElm = document.querySelector(`.pair-row#${pair}`);
        const granElm = document.querySelector(`.pair-row#${pair} > .gran.${gran}`);

        //reset
        granElm.classList.remove('mkt_state_sell');
        granElm.classList.remove('mkt_state_buy');
        granElm.classList.remove('trigger');
        granElm.classList.remove('ready');

        // set last triggered time
        granElm.setAttribute('data-time', signalsCandle.at(-1).time);
        const allGransLastTriggeredTime = [...Array.from(pairElm.querySelectorAll('.gran')).map(e => parseInt(e.getAttribute('data-time') ?? 0))];
        pairElm.setAttribute('data-time', Math.max(...allGransLastTriggeredTime));

        // set market state
        granElm.classList.add(`mkt_state_${shouldBuy.at(-1).value ? 'buy' : 'sell'}`);

        // set trigger & ready
        const readyCond = correctZoneSize.at(-1).value && freshZone.at(-1).value && imbInProtectedArea.at(-1).value;
        const triggerCond = readyCond && enteredImbZone.at(-1).value;
        if (triggerCond) granElm.classList.add(`trigger`);
        else if (readyCond) granElm.classList.add('ready');
    }
</script>
<!--
    calculateOMS(candles): the core trading-signal indicator. Runs a single
    pass over the candle array (needs at least 12 candles) using an 11-candle
    (INDICATOR_PERIOD) rolling window centered on INDICATOR_MIDPT:
    - Zigzag: flags the midpoint candle of the window as a pivot high/low
      when it's the extreme of the window, and records it in zzPts whenever
      it extends beyond the last zigzag point (zzState tracks trend
      direction: 1 up, -1 down).
    - Protected high/low: once a new zigzag pivot both breaks the prior
      extreme and its close confirms it, promotes it to protectedHigh/
      protectedLow and flips mktState (1 = bullish, -1 = bearish); the
      opposite protected level is seeded from the prior zigzag point.
    - Imbalance (fair value gap) zones: after a protected level updates,
      scans back over the impulse leg for a 2-candle gap (candle i-2's high/
      low vs candle i's low/high) in the direction of the trend and records
      it as imbUpper/imbLower, marking the zone "fresh" (imbZoneFresh).
    - Signal conditions, computed every candle: shouldBuy (trend is
      bullish), correctZoneSize (the imbalance covers >=80% of the distance
      to the protected level), freshZone (imbalance hasn't been touched),
      imbInProtectedArea (the imbalance sits within the protected range),
      and enteredImbZone (price just crossed into the imbalance this
      candle). A "trigger" is all four conditions true simultaneously, which
      consumes the zone's freshness and emits a signal arrow (signalsCandle),
      a raw signal point (signals), and a take-profit marker (tp) sized off
      the opposite protected level.
    Returns all of the above per-candle series for the chart/indicator
    painters to consume.
-->
<script>
    const calculateOMS = (candles) => {
        if (candles.length < 12) return;

        // Indicator Settings
        const INDICATOR_PERIOD = 11;
        const INDICATOR_MIDPT = parseInt(INDICATOR_PERIOD / 2);

        const highestPivot = [];
        const lowestPivot = [];
        const zzState = Array.from(candles, c => ({ time: c.time, value: 0 }));
        const zzPts = [];
        const protectedHigh = Array.from(candles, c => ({ time: c.time, value: 0.0 }));
        const protectedLow = Array.from(candles, c => ({ time: c.time, value: -9999999.0 }));
        const mktState = Array.from(candles, c => ({ time: c.time, value: 0 }));
        const impulseSince = Array.from(candles, c => ({ time: c.time, value: -1 }));
        const imbUpper = Array.from(candles, c => ({ time: c.time, value: 0 }));
        const imbLower = Array.from(candles, c => ({ time: c.time, value: 0 }));
        const imbZoneFresh = Array.from(candles, c => ({ time: c.time, value: 0 }));

        const entryLine = [];

        const shouldBuy = [];
        const correctZoneSize = [];
        const freshZone = [];
        const imbInProtectedArea = [];
        const enteredImbZone = [];

        const signalsCandle = [];
        const signals = [];
        const tp = [];

        for (let i = INDICATOR_PERIOD; i < candles.length; i++) {
            zzState[i].value = zzState[i - 1].value;
            protectedHigh[i].value = protectedHigh[i - 1].value;
            protectedLow[i].value = protectedLow[i - 1].value;
            mktState[i].value = mktState[i - 1].value;
            impulseSince[i].value = impulseSince[i - 1].value + 1;
            imbUpper[i].value = imbUpper[i - 1].value;
            imbLower[i].value = imbLower[i - 1].value;
            imbZoneFresh[i].value = imbZoneFresh[i - 1].value;
            const periodWindowCandles = candles.slice(i - INDICATOR_PERIOD + 1, i + 1);
            const highestIndex = periodWindowCandles.reduce((maxIdx, current, idx, arr) =>
                current.high > arr[maxIdx].high ? idx : maxIdx, 0
            );
            const lowestIndex = periodWindowCandles.reduce((minIdx, current, idx, arr) =>
                current.low < arr[minIdx].low ? idx : minIdx, 0
            );

            const pivotHigh = {
                time: candles[i].time,
                value: candles[i - INDICATOR_MIDPT].high
            }

            const pivotLow = {
                time: candles[i].time,
                value: candles[i - INDICATOR_MIDPT].low
            }

            const pivotHighFound = highestIndex == INDICATOR_MIDPT;
            const pivotLowFound = lowestIndex == INDICATOR_MIDPT;

            if (pivotHighFound) {
                highestPivot.push(pivotHigh);
                if ((zzState[i - 1].value == 0) ||
                    (pivotHigh.value > zzPts.at(-1).value)) {
                    zzPts.push(pivotHigh);
                    zzState[i].value = 1;
                    impulseSince[i].value = -1;
                    if (zzPts.length > 3 && highestPivot.length > 3 &&
                        Math.min(pivotHigh.value, candles[i - INDICATOR_MIDPT].close) > protectedHigh[i - 1].value) {
                        protectedHigh[i].value = pivotHigh.value;
                        mktState[i].value = 1;
                        if (zzState[i - 1].value < 1) {
                            protectedLow[i].value = zzPts[zzPts.length - 2].value;
                        }
                    }
                }
            }
            if (pivotLowFound) {
                lowestPivot.push(pivotLow);
                if ((zzState[i - 1].value == 0) ||
                    (pivotLow.value < zzPts.at(-1).value)) {
                    zzPts.push(pivotLow);
                    zzState[i].value = -1;
                    impulseSince[i].value = -1;
                    if (zzPts.length > 3 && lowestPivot.length > 3 &&
                        Math.max(pivotLow.value, candles[i - INDICATOR_MIDPT].close) < protectedLow[i - 1].value) {
                        protectedLow[i].value = pivotLow.value;
                        mktState[i].value = -1;
                        if (zzState[i - 1].value > -1) {
                            protectedHigh[i].value = zzPts[zzPts.length - 2].value;
                        }
                    }
                }
            }

            // find last fvg
            if (protectedHigh[i].value != protectedHigh[i - 1].value) {
                const fromIndex = i - impulseSince[i - 1].value - 5;
                const toIndex = i - 5;
                if (fromIndex < 0) continue;
                for (let x = fromIndex; x <= toIndex; x++) {
                    if (mktState[x].value == 1) {
                        if (candles[x - 2].high < candles[x].low) {
                            imbUpper[i].value = candles[x - 2].high;
                            imbLower[i].value = candles[x - 2].low;
                            imbZoneFresh[i].value = 1;
                            break;
                        }
                    } else {
                        if (candles[x - 2].low > candles[x].high) {
                            imbUpper[i].value = candles[x - 2].high;
                            imbLower[i].value = candles[x - 2].low;
                            imbZoneFresh[i].value = 1;
                            break;
                        }
                    }
                }
            }

            // create signals
            const _shouldBuy = mktState[i].value == 1;
            const _correctZoneSize = (protectedHigh[i].value - protectedLow[i].value) * 0.8 <= (_shouldBuy ?
                protectedHigh[i].value - imbUpper[i].value :
                imbLower[i].value - protectedLow[i].value);
            const _freshZone = imbZoneFresh[i].value == 1;
            const _imbInProtectedArea = _shouldBuy ?
                protectedLow[i].value <= imbLower[i].value :
                protectedHigh[i].value >= imbUpper[i].value
            const _enteredImbZone = _shouldBuy ?
                candles[i].low < imbUpper[i].value && candles[i - 1].low > imbUpper[i].value :
                candles[i].high > imbLower[i].value && candles[i - 1].high < imbLower[i].value;

            entryLine.push({
                time: candles[i].time,
                value: (_shouldBuy ? imbUpper : imbLower)[i].value
            })
            shouldBuy.push({
                time: candles[i].time,
                value: _shouldBuy ? 1 : 0
            });
            correctZoneSize.push({
                time: candles[i].time,
                value: _correctZoneSize ? 1 : 0
            });
            freshZone.push({
                time: candles[i].time,
                value: _freshZone ? 1 : 0
            });
            imbInProtectedArea.push({
                time: candles[i].time,
                value: _imbInProtectedArea ? 1 : 0
            });
            enteredImbZone.push({
                time: candles[i].time,
                value: _enteredImbZone ? 1 : 0
            });

            const trigger = _correctZoneSize && _freshZone && _imbInProtectedArea && _enteredImbZone;
            if (_enteredImbZone) imbZoneFresh[i].value = -1;
            if (trigger) {
                signalsCandle.push({
                    time: candles[i].time,
                    position: _shouldBuy ? 'belowBar' : 'aboveBar',
                    color: _shouldBuy ? 'lime' : 'pink',
                    shape: _shouldBuy ? 'arrowUp' : 'arrowDown',
                    text: '',
                });
                signals.push({
                    time: candles[i].time,
                    position: 'atPriceBottom',
                    price: 0,
                    color: _shouldBuy ? 'lime' : 'pink',
                    shape: _shouldBuy ? 'arrowUp' : 'arrowDown',
                    text: '',
                });
                tp.push({
                    time: candles[i].time,
                    position: _shouldBuy ? 'atPriceTop' : 'atPriceBottom',
                    price: _shouldBuy ?
                        imbUpper[i].value + (imbUpper[i].value - protectedLow[i].value) :
                        imbLower[i].value - (protectedHigh[i].value - imbLower[i].value),
                    color: 'dodgerblue',
                    shape: _shouldBuy ? 'arrowDown' : 'arrowUp',
                    text: '',
                });
            }
        }

        return {
            zzPts,
            protectedHigh, protectedLow,
            imbUpper, imbLower,
            entryLine,
            mktState,
            signalsCandle, signals, tp,
            shouldBuy, correctZoneSize, freshZone, imbInProtectedArea, enteredImbZone
        }
    }
</script>
<!--
    Defines the trigger-notification and sidebar-sorting helpers - called
    from the 5s poll loop below, not from this block's own interval - plus
    the staleness-timer loop itself.
    - checkIfNeedNotification(): diffs the pairs currently showing a
      ".gran.trigger" badge against the previous tick's list
      (prevTriggeredList); for each newly-triggered pair it plays
      playTripleClick() and calls sendTelegramMessage().
    - playTripleClick(): fires three short 1kHz triangle-wave blips via the
      Web Audio API (~0/150/300ms apart) as an audible alert.
    - sendTelegramMessage(pair, granArr): POSTs to the Telegram Bot API
      (using BOT_TOKEN/CHAT_ID from the config script above) with the pair
      name and its triggered granularities, HTML-underlined.
    - sortList(): re-partitions the sidebar rows between the #triggered and
      #watchlist containers based on whether a row has a child
      ".gran.trigger" element (matching the class updatePairRows, above,
      actually sets), sorting each group by `data-time` descending (most
      recently triggered/ready pair first) before rebuilding that
      container's innerHTML from the matching rows' outerHTML.
    - This block's own setInterval (500ms) only runs the staleness timer:
      for each pair, find the latest lastUpdatedTime across its
      granularities, write the elapsed seconds into that row's .timer
      element, and add a "warning" class once it's 20+ seconds stale (a
      sign the 5s poll loop below is stalled, e.g. an expired OANDA token).
      No-ops until every pair/granularity has been loaded at least once.
-->
<script>
    let prevTriggeredList = [];
    const checkIfNeedNotification = () => {
        const triggeredElmList = document.querySelectorAll('.pair-row:has(> .gran.trigger)');
        const triggeredPairArr = Array.from(triggeredElmList).map(e => e.id);
        const prevSet = new Set(prevTriggeredList);
        const newPairs = triggeredPairArr.filter(e => !prevSet.has(e));
        prevTriggeredList = triggeredPairArr;
        if (newPairs.length > 0) {
            playTripleClick();
            for (const pair of newPairs) {
                const granArr = Array.from(document.querySelectorAll(`.pair-row#${pair} > .gran.trigger`)).map(e => e.innerText);
                sendTelegramMessage(pair, granArr);
            }
        }
    }

    const playTripleClick = () => {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const triggerClick = (delayMs) => {
            const time = audioCtx.currentTime + (delayMs / 1000);
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // 'triangle' or 'square' gives a sharper, more mechanical sound than 'sine'
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(1000, time); // High pitch for a crisp click

            // Instant attack, fast decay
            gainNode.gain.setValueAtTime(2.5, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.02); // 20ms fade out

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start(time);
            oscillator.stop(time + 0.025); // Hard stop just after the fade
        }

        // Play the two clicks in rapid succession (70ms apart)
        triggerClick(0);
        triggerClick(150);
        triggerClick(300);
    }

    const sendTelegramMessage = async (pair, granArr = []) => {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const text = `-- ${pair.replace('_', '/')} -- [ ` + granArr.map(e => '<u>' + e + '</u>').join(' | ') + ' ]';
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text,
                    parse_mode: 'HTML' // Optional: Allows bold/italic formatting
                })
            });

            const data = await response.json();

            if (!data.ok) {
                console.error('Telegram API Error:', data.description);
            }
        } catch (error) {
            console.error('Network Error:', error);
        }
    }

    const sortList = () => {
        const triggeredElmList = document.querySelectorAll('.pair-row:has(> .gran.trigger)');
        const elmList = document.querySelectorAll('.pair-row:not(:has(> .gran.trigger))');
        const triggeredHTML = Array.from(triggeredElmList).sort((a, b) =>
            parseInt(b.getAttribute('data-time')) - parseInt(a.getAttribute('data-time'))).map(node => node.outerHTML).join('');
        const watchlistHTML = Array.from(elmList).sort((a, b) =>
            parseInt(b.getAttribute('data-time')) - parseInt(a.getAttribute('data-time'))).map(node => node.outerHTML).join('');
        document.querySelector('#sidebar > #triggered').innerHTML = triggeredHTML;
        document.querySelector('#sidebar > #watchlist').innerHTML = watchlistHTML;
    }

    setInterval(() => {
        if (Object.keys(allCandlesData).length < PAIRS.length * GRAN.length) return;
        for (const pair of PAIRS) {
            const unixTimeNow = Math.floor(Date.now() / 1000);
            let oldestUpdatedTime = unixTimeNow;
            for (const gran of GRAN) {
                const key = `${pair}_${gran}`;
                oldestUpdatedTime = Math.min(oldestUpdatedTime, allCandlesData[key]['lastUpdatedTime']);
            }
            const elaspedTime = unixTimeNow - oldestUpdatedTime;
            const timerElm = document.querySelector(`.pair-row#${pair} > .timer`);
            timerElm.innerText = elaspedTime + 's';
            timerElm.classList.remove('warning');
            if (elaspedTime >= 20) timerElm.classList.add('warning');
        }
    }, 500);
</script>
<!--
    Bootstraps and drives the data feed:
    - On load, seeds an empty allCandlesData entry for every pair/granularity
      combination and kicks off a full getCandles fetch for each.
    - Every 5s thereafter, re-fetches all pair/granularity combinations
      (getCandles is called with its default count of 5000 both here and on
      first load, so every poll replaces the full cached candle array rather
      than merging), then, if a pair is currently selected, calls
      render(pair, false) to repaint its charts with the fresh data without
      resetting the visible time range, then calls sortList() and
      checkIfNeedNotification() (both defined above) to resort the sidebar
      by trigger state/recency and fire any new trigger alerts.
-->
<script>
    for (const pair of PAIRS) {
        for (const gran of GRAN) {
            const key = `${pair}_${gran}`;
            const lastUpdatedTime = Math.floor(Date.now() / 1000);
            allCandlesData[key] = { candles: [], indicators: {}, lastUpdatedTime };
            getCandles(pair, gran);
        }
    }
    setInterval(() => {
        for (const pair of PAIRS) {
            for (const gran of GRAN) {
                getCandles(pair, gran);
            }
        }
        const selectedPair = document.querySelector('.pair-row.selected');
        if (selectedPair != null && selectedPair != undefined) render(selectedPair.id, false);

        sortList();
        checkIfNeedNotification();
    }, 5000);
</script>
<!--
    createPairRows(): builds the sidebar's list of instrument rows, one per
    entry in PAIRS. Each row shows the pair name (slash-separated), one
    ".gran" badge per granularity in GRAN (colored/bordered later by
    getCandles based on market state), and a staleness ".timer" element -
    then injects the assembled HTML into the #watchlist container in one
    shot (sortList, above, later redistributes rows into #triggered).
    Clicking a row calls render(pair) via its inline onclick. Runs once
    immediately.
-->
<script>
    const createPairRows = () => {
        let htmlStr = '';
        for (const pair of PAIRS) {
            htmlStr += `<div class="pair-row" id="${pair}" onclick="render('${pair}')"><div class="name">${pair.replace('_', '/')}</div>`;
            for (const gran of GRAN) {
                htmlStr += `<div class="gran ${gran}">${gran}</div>`;
            }
            htmlStr += `<div class="timer">0s</div>`;
            htmlStr += `</div>`;
        }
        document.querySelector("#sidebar #watchlist").innerHTML = htmlStr;
    }
    createPairRows();
</script>
<!--
    Keyboard navigation: on ArrowDown/ArrowUp keydown, moves the sidebar
    selection to the next/previous pair (wrapping around at either end). The
    `.selected` class moves immediately each keystroke, but the actual
    render(pair, true) is debounced 300ms so holding/repeating the key only
    repaints charts once, for the pair the user finally lands on. If nothing
    is selected yet, either key selects the first pair in PAIRS instead of
    stepping relative to a selection.
-->
<script>
    let renderTimer = null;
    const debouncedRender = (pair) => {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(() => render(pair, true), 300);
    }

    window.addEventListener('keydown', (event) => {
        const selectDefault = () => {
            document.querySelector(`.pair-row#${PAIRS[0]}`).classList.add('selected');
            debouncedRender(PAIRS[0]);
            return;
        }

        const select = (next = true) => {
            const selectedPair = document.querySelector('.pair-row.selected');
            if (selectedPair === null || selectedPair === undefined) {
                selectDefault();
            } else {
                const pairs = [...document.getElementsByClassName('pair-row')];
                const index = pairs.indexOf(selectedPair);
                selectedPair.classList.remove('selected');
                if (next) {
                    let nextIndex = index + 1;
                    if (nextIndex == pairs.length) nextIndex = 0;
                    pairs[nextIndex].classList.add('selected');
                    debouncedRender(pairs[nextIndex].id);
                } else {
                    let nextIndex = index - 1;
                    if (nextIndex == -1) nextIndex = pairs.length - 1;
                    pairs[nextIndex].classList.add('selected');
                    debouncedRender(pairs[nextIndex].id);
                }
            }
        }

        switch (event.key) {
            case 'ArrowDown':
                select(true);
                break;
            case 'ArrowUp':
                select(false);
                break;
        }
    });
</script>
