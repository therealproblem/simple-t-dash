<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash</title>
    <script src="https://unpkg.com/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="chart"></div>
</body>
<script>
    const MONTH = [
        'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec',
    ]
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        autoSize: true,
        layout: {
            background: 'black',
            textColor: '#888',
            attributionLogo: false
        },
        crosshair: {
            mode: 0,
            vertLine: {
                color: '#333',
                labelBackgroundColor: '#333',
            },
            horzLine: {
                color: '#333',
                labelBackgroundColor: '#333',
            }
        },
        grid: {
            vertLines: {
                visible: false
            },
            horzLines: {
                visible: false
            }
        },
        localization: {
            timeFormatter: (time) => {
                // time is a UTCTimestamp in seconds
                const date = new Date(time * 1000);
                return date.toLocaleDateString('en-GB', {
                    timeZone: 'Europe/Athens',
                    month: 'short',
                    day: '2-digit',
                    year: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hourCycle: 'h23',
                    hour12: false
                }).replace(/\s\bat\b\s/, ', ');
            },
        },
        timeScale: {
            timeVisible: true,
            tickMarkFormatter: (time, tickMarkType, locale) => {
                const date = new Date(time * 1000);
                switch (tickMarkType) {
                    case LightweightCharts.TickMarkType.Year:
                        return date.toLocaleDateString('en-US', {
                            timeZone: 'Europe/Athens',
                            year: 'numeric'
                        });

                    case LightweightCharts.TickMarkType.Month:
                        return date.toLocaleDateString('en-US', {
                            timeZone: 'Europe/Athens',
                            month: 'short'
                        });

                    case LightweightCharts.TickMarkType.DayOfMonth:
                        return date.toLocaleDateString('en-GB', {
                            timeZone: 'Europe/Athens',
                            month: 'short',
                            day: '2-digit',
                            year: '2-digit'
                        });

                    case LightweightCharts.TickMarkType.Time:
                        return date.toLocaleTimeString('en-US', {
                            timeZone: 'Europe/Athens',
                            hour: '2-digit',
                            minute: '2-digit',
                            hour12: false
                        });
                    default:
                        return date.toLocaleDateString('en-GB', {
                            timeZone: 'Europe/Athens',
                            month: 'short',
                            day: '2-digit',
                            year: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            hourCycle: 'h23',
                            hour12: false
                        }).replace(/\s\bat\b\s/, ', ');
                }
            },
        },
    });
    const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: 'white',
        downColor: '#1f1f1f',
        borderColor: 'white',
        wickColor: 'white'
    });
    const timeScale = chart.timeScale();

    const TOKEN = localStorage.getItem('oanda_token') ?? prompt('OANDA token:');
    if (TOKEN) localStorage.setItem('oanda_token', TOKEN);

    const ACCOUNT = '001-003-11032463-001';

    let candlesData = [];
</script>
<script>
    // the browser pools + keep-alives connections to OANDA automatically (HTTP/2)
    const getCandles = (pair, gran, count = 5000) => {
        const url = new URL(`https://api-fxtrade.oanda.com/v3/accounts/${ACCOUNT}/instruments/${pair}/candles`);
        url.search = new URLSearchParams({
            granularity: gran,
            price: 'B',
            count: count
        });
        return fetch(url, {
            headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Accept-Datetime-Format': 'Unix'
            }
        })
            .then(res => {
                if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);
                return res.json();
            })
            .then(({ candles }) => candles.map(e => ({
                ...e,
                time: parseInt(e.time),
                bid: { open: +e.bid.o, high: +e.bid.h, low: +e.bid.l, close: +e.bid.c }
            })));
    };

    Promise.all([getCandles('XAU_USD', 'H1')])
        .then(([h1]) => {
            candlesData = h1;
            candleSeries.setData(h1.map(c => ({
                time: c.time,
                open: c.bid.open,
                high: c.bid.high,
                low: c.bid.low,
                close: c.bid.close
            })));
        })
        .then(() => {
            const totalBars = candlesData.length; 
            // Set the last 50 candles to be visible
            timeScale.setVisibleLogicalRange({
                from: totalBars - 50,
                to: totalBars + 10,
            });
        })
        .catch(console.error);
</script>
<script>
    // same origin note doesn't apply here: streaming uses a separate host (stream- vs api-)
    // and holds one long-lived connection by design, so there's nothing to pool.
    const streamPrices = async (pairs, onPrice) => {
        const url = new URL(`https://stream-fxtrade.oanda.com/v3/accounts/${ACCOUNT}/pricing/stream`);
        url.search = new URLSearchParams({ instruments: pairs.join(',') });
        const res = await fetch(url, {
            headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Accept-Datetime-Format': 'Unix'
            }
        });
        if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);

        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
        let buf = '';
        while (true) {
            const { done, value } = await reader.read();
            if (done) return;
            buf += value;
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
                if (line) onPrice(JSON.parse(line));
            }
        }
    };

    // streamPrices(['XAU_USD', 'EUR_USD', 'GBP_USD', 'USD_JPY'], msg => {

</script>

</html>
