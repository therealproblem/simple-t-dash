<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash</title>
    <script src="https://unpkg.com/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="chart"></div>
</body>
<script>
    const GRAN = ['M5', 'M15', 'M30', 'H1'];
    const MONTH = [
        'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec',
    ]
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        autoSize: true,
        layout: {
            background: 'black',
            textColor: '#888',
            attributionLogo: false
        },
        crosshair: {
            mode: 0,
            vertLine: {
                color: '#333',
                labelBackgroundColor: '#333',
            },
            horzLine: {
                color: '#333',
                labelBackgroundColor: '#333',
            }
        },
        grid: {
            vertLines: {
                visible: false
            },
            horzLines: {
                visible: false
            }
        },
        localization: {
            timeFormatter: (time) => {
                // time is a UTCTimestamp in seconds
                const date = new Date(time * 1000);
                return date.toLocaleDateString('en-GB', {
                    timeZone: 'Europe/Athens',
                    month: 'short',
                    day: '2-digit',
                    year: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hourCycle: 'h23',
                    hour12: false
                }).replace(/\s\bat\b\s/, ', ');
            },
        },
        timeScale: {
            timeVisible: true,
            tickMarkFormatter: (time, tickMarkType, locale) => {
                const date = new Date(time * 1000);
                switch (tickMarkType) {
                    case LightweightCharts.TickMarkType.Year:
                        return date.toLocaleDateString('en-US', {
                            timeZone: 'Europe/Athens',
                            year: 'numeric'
                        });

                    case LightweightCharts.TickMarkType.Month:
                        return date.toLocaleDateString('en-US', {
                            timeZone: 'Europe/Athens',
                            month: 'short'
                        });

                    case LightweightCharts.TickMarkType.DayOfMonth:
                        return date.toLocaleDateString('en-GB', {
                            timeZone: 'Europe/Athens',
                            month: 'short',
                            day: '2-digit',
                            year: '2-digit'
                        });

                    case LightweightCharts.TickMarkType.Time:
                        return date.toLocaleTimeString('en-US', {
                            timeZone: 'Europe/Athens',
                            hour: '2-digit',
                            minute: '2-digit',
                            hour12: false
                        });
                    default:
                        return date.toLocaleDateString('en-GB', {
                            timeZone: 'Europe/Athens',
                            month: 'short',
                            day: '2-digit',
                            year: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            hourCycle: 'h23',
                            hour12: false
                        }).replace(/\s\bat\b\s/, ', ');
                }
            },
        },
    });
    const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: 'white',
        downColor: '#1f1f1f',
        borderColor: 'white',
        wickColor: 'white'
    });
    const timeScale = chart.timeScale();

    const TOKEN = localStorage.getItem('oanda_token') ?? prompt('OANDA token:');
    if (TOKEN) localStorage.setItem('oanda_token', TOKEN);

    const ACCOUNT = '001-003-11032463-001';
</script>
<script>
    const setChartData = (data, resetChart = false) => {
        candleSeries.setData(data.map(c => ({
            time: c.time,
            open: c.open,
            high: c.high,
            low: c.low,
            close: c.close
        })));

        if (resetChart) {
            const totalBars = data.length;
            // Set the last 50 candles to be visible
            timeScale.setVisibleLogicalRange({
                from: totalBars - 50,
                to: totalBars + 10,
            });
        }
    }
</script>
<script>
    // the browser pools + keep-alives connections to OANDA automatically (HTTP/2)
    const getCandles = (pair, gran, count = 5000) => {
        const url = new URL(`https://api-fxtrade.oanda.com/v3/accounts/${ACCOUNT}/instruments/${pair}/candles`);
        url.search = new URLSearchParams({
            granularity: gran,
            price: 'B',
            count: count
        });
        return fetch(url, {
            headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Accept-Datetime-Format': 'Unix'
            }
        })
            .then(res => {
                if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);
                return res.json();
            })
            .then(({ candles }) => candles.map(e => ({
                volume: e.volume,
                complete: e.complete,
                time: parseInt(e.time),
                open: +e.bid.o,
                high: +e.bid.h,
                low: +e.bid.l,
                close: +e.bid.c
            })))
            .then(candles => {
                const key = `${pair}_${gran}`;
                let candlesData = [];
                if (count === 5000) {
                    candlesData = candles;
                    localStorage.setItem(key, JSON.stringify(candles));
                } else {
                    candlesData = JSON.parse(localStorage.getItem(key));
                    for (const candle of candles) {
                        if (candlesData.filter(e => e.time == candle.time).length == 0)
                            candlesData.push(candle);
                        else {
                            candlesData = candlesData.map(e => {
                                if (e.time == candle.time)
                                    return candle
                                else
                                    return e
                            });
                        }
                    }
                    localStorage.setItem(key, JSON.stringify(candlesData));
                }
                setChartData(candlesData, count === 5000);
                calculateOMS(candles);
                return candles;
            });
    };
</script>
<script>
    getCandles('XAU_USD', 'H1');
    setInterval(() => {
        getCandles('XAU_USD', 'H1', 2)
    }, 500);
</script>
<script>
    const calculateOMS = (candles) => {
        if (candles.length < 12) return;

        // Indicator Settings
        const INDICATOR_PERIOD = 11;
        const INDICATOR_MIDPT = parseInt(INDICATOR_PERIOD / 2);

        const highestPivot = [];
        const lowestPivot = [];
        const zzState = Array.from(candles, c => ({ time: c.time, value: 0 }));
        const zzPts = [];
        const protectedHigh = Array.from(candles, c => ({ time: c.time, value: 0.0 }));
        const protectedLow = Array.from(candles, c => ({ time: c.time, value: -9999999.0 }));
        const mktState = Array.from(candles, c => ({ time: c.time, value: 0 }));
        const impulseSince = Array.from(candles, c => ({ time: c.time, value: -1 }));
        const imbUpper = Array.from(candles, c => ({ time: c.time, value: 0 }));
        const imbLower = Array.from(candles, c => ({ time: c.time, value: 0 }));
        const imbZoneFresh = Array.from(candles, c => ({ time: c.time, value: 0 }));

        const signalsCandle = [];
        const signals = [];
        const tp = [];

        for (let i = INDICATOR_PERIOD; i < candles.length; i++) {
            zzState[i].value = zzState[i - 1].value;
            protectedHigh[i].value = protectedHigh[i - 1].value;
            protectedLow[i].value = protectedLow[i - 1].value;
            mktState[i].value = mktState[i - 1].value;
            impulseSince[i].value = impulseSince[i - 1].value + 1;
            imbUpper[i].value = imbUpper[i - 1].value;
            imbLower[i].value = imbLower[i - 1].value;
            imbZoneFresh[i].value = imbZoneFresh[i - 1].value;
            const periodWindowCandles = candles.slice(i - INDICATOR_PERIOD + 1, i + 1);
            const highestIndex = periodWindowCandles.reduce((maxIdx, current, idx, arr) =>
                current.high > arr[maxIdx].high ? idx : maxIdx, 0
            );
            const lowestIndex = periodWindowCandles.reduce((minIdx, current, idx, arr) =>
                current.low < arr[minIdx].low ? idx : minIdx, 0
            );

            const pivotHigh = {
                time: candles[i].time,
                value: candles[i - INDICATOR_MIDPT].high
            }

            const pivotLow = {
                time: candles[i].time,
                value: candles[i - INDICATOR_MIDPT].low
            }

            const pivotHighFound = highestIndex == INDICATOR_MIDPT;
            const pivotLowFound = lowestIndex == INDICATOR_MIDPT;

            if (pivotHighFound) {
                highestPivot.push(pivotHigh);
                if ((zzState[i - 1].value == 0) ||
                    (pivotHigh.value > zzPts[zzPts.length - 1].value)) {
                    zzPts.push(pivotHigh);
                    zzState[i].value = 1;
                    impulseSince[i].value = -1;
                    if (zzPts.length > 3 && highestPivot.length > 3 &&
                        Math.min(pivotHigh.value, candles[i - INDICATOR_MIDPT].close) > protectedHigh[i - 1].value) {
                        protectedHigh[i].value = pivotHigh.value;
                        mktState[i].value = 1;
                        if (zzState[i - 1].value < 1) {
                            protectedLow[i].value = zzPts[zzPts.length - 2].value;
                        }
                    }
                }
            }
            if (pivotLowFound) {
                lowestPivot.push(pivotLow);
                if ((zzState[i - 1].value == 0) ||
                    (pivotLow.value < zzPts[zzPts.length - 1].value)) {
                    zzPts.push(pivotLow);
                    zzState[i].value = -1;
                    impulseSince[i].value = -1;
                    if (zzPts.length > 3 && lowestPivot.length > 3 &&
                        Math.max(pivotLow.value, candles[i - INDICATOR_MIDPT].close) < protectedLow[i - 1].value) {
                        protectedLow[i].value = pivotLow.value;
                        mktState[i].value = -1;
                        if (zzState[i - 1].value > -1) {
                            protectedHigh[i].value = zzPts[zzPts.length - 2].value;
                        }
                    }
                }
            }

            // find last fvg
            if (protectedHigh[i].value != protectedHigh[i - 1].value) {
                const fromIndex = i - impulseSince[i - 1].value - 5;
                const toIndex = i - 5;
                if (fromIndex < 0) continue;
                for (let x = fromIndex; x <= toIndex; x++) {
                    if (mktState[x].value == 1) {
                        if (candles[x - 2].high < candles[x].low) {
                            imbUpper[i].value = candles[x - 2].high;
                            imbLower[i].value = candles[x - 2].low;
                            imbZoneFresh[i].value = 1;
                            break;
                        }
                    } else {
                        if (candles[x - 2].low > candles[x].high) {
                            imbUpper[i].value = candles[x - 2].high;
                            imbLower[i].value = candles[x - 2].low;
                            imbZoneFresh[i].value = 1;
                            break;
                        }
                    }
                }
            }

            // create signals
            const buyConditions = mktState[i].value == 1 &&
                (protectedHigh[i].value - protectedLow[i].value) * 0.8 <= protectedHigh[i].value - imbUpper[i].value &&
                candles[i].low < imbUpper[i].value &&
                protectedLow[i].value <= imbLower[i].value &&
                candles[i - 1].low > imbUpper[i].value &&
                imbZoneFresh[i].value == 1;
            const sellConditions = mktState[i].value == -1 &&
                (protectedHigh[i].value - protectedLow[i].value) * 0.8 <= imbLower[i].value - protectedLow[i].value &&
                candles[i].high > imbLower[i].value &&
                protectedHigh[i].value >= imbUpper[i].value &&
                candles[i - 1].high < imbLower[i].value &&
                imbZoneFresh[i].value == 1;
            if (buyConditions) {
                signalsCandle.push({
                    time: candles[i].time,
                    position: 'belowBar',
                    color: 'lime',
                    shape: 'arrowUp',
                    text: '',
                });
                signals.push({
                    time: candles[i].time,
                    position: 'belowBar',
                    color: 'lime',
                    shape: 'arrowUp',
                    text: '',
                });
                tp.push({
                    time: candles[i].time,
                    position: 'atPriceTop',
                    price: imbUpper[i].value + (imbUpper[i].value - protectedLow[i].value),
                    color: 'dodgerblue',
                    shape: 'arrowDown',
                    text: '',
                });
                imbZoneFresh[i].value = -1;
            } else if (sellConditions) {
                signalsCandle.push({
                    time: candles[i].time,
                    position: 'aboveBar',
                    color: 'pink',
                    shape: 'arrowDown',
                    text: '',
                });
                signals.push({
                    time: candles[i].time,
                    position: 'belowBar',
                    color: 'pink',
                    shape: 'arrowDown',
                    text: '',
                });
                tp.push({
                    time: candles[i].time,
                    position: 'atPriceBottom',
                    price: imbLower[i].value - (protectedHigh[i].value - imbLower[i].value),
                    color: 'dodgerblue',
                    shape: 'arrowUp',
                    text: '',
                });
                imbZoneFresh[i].value = -1;
            }
        }

        const line = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 1,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            crosshairMarkerVisible: false
        });
        const line2 = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 1,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            color: 'teal',
            crosshairMarkerVisible: false
        });
        const line3 = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 1,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            color: 'crimson',
            crosshairMarkerVisible: false
        });
        const line4 = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 1,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            color: 'dodgerblue',
            crosshairMarkerVisible: false
        });
        const line5 = chart.addSeries(LightweightCharts.LineSeries, {
            lineWidth: 1,
            axisLabelVisible: false,
            lastValueVisible: false,
            priceLineVisible: false,
            color: 'dodgerblue',
            crosshairMarkerVisible: false
        });
        const mktStateUp = chart.addSeries(
            LightweightCharts.HistogramSeries,
            {
                color: 'teal',
                axisLabelVisible: false,
                lastValueVisible: false,
                priceLineVisible: false,
                priceFormat: {
                    type: 'volume',
                },
            },
            1 // Pane index
        );
        const mktStateDown = chart.addSeries(
            LightweightCharts.HistogramSeries,
            {
                color: 'crimson',
                axisLabelVisible: false,
                lastValueVisible: false,
                priceLineVisible: false,
                priceFormat: {
                    type: 'volume',
                },
            },
            1 // Pane index
        );
        const impulse = chart.addSeries(
            LightweightCharts.HistogramSeries,
            {
                color: 'dodgerblue',
                axisLabelVisible: false,
                lastValueVisible: false,
                priceLineVisible: false,
                priceFormat: {
                    type: 'volume',
                },
            },
            1 // Pane index
        );

        LightweightCharts.createSeriesMarkers(candleSeries, signalsCandle);
        LightweightCharts.createSeriesMarkers(impulse, signals);
        LightweightCharts.createSeriesMarkers(candleSeries, tp);

        line.setData(zzPts);
        line2.setData(protectedHigh);
        line3.setData(protectedLow);
        line4.setData(imbUpper);
        line5.setData(imbLower);
        mktStateDown.setData(mktState.filter(e => e.value == -1).map(e => ({ time: e.time, value: 1 })));
        mktStateUp.setData(mktState.filter(e => e.value == 1).map(e => ({ time: e.time, value: 1 })));
        impulse.setData(candles.map(e => ({ time: e.time, value: 0 })));
    }
</script>

</html>
